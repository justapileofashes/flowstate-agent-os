appId: com.flowstate.app
productName: Flowstate
copyright: Copyright © 2026 Ashton Rey Kusuma
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!node_modules/**/*"
  - "node_modules/better-sqlite3/**"
  - "node_modules/bindings/**"
  - "node_modules/file-uri-to-path/**"
  # Terminal PTY (ConPTY on Windows): native addon + worker + OpenConsole.exe.
  # Loaded at runtime from app.asar.unpacked (src/main/ipc/handlers/terminal.ts).
  - "node_modules/@lydell/**"
  - "!node_modules/@lydell/**/*.pdb"
asar: true
asarUnpack:
  - "node_modules/better-sqlite3/**"
  - "node_modules/@lydell/**"
# Native modules come from prebuilds (scripts/sqlite-bindings.mjs installs the
# Electron + Node better-sqlite3 binaries side by side under lib/binding/), so
# electron-builder must not rebuild them: its rebuild recreates build/Release
# with the Electron ABI, which shadows the Node binary and breaks `vitest`.
npmRebuild: false
# Harden the packaged binary (Electron Fuses). Closes off ways a shipped exe can
# be repurposed as a generic Node runtime or have its app code swapped out:
#   - runAsNode off            → ELECTRON_RUN_AS_NODE can't turn the exe into node
#   - nodeOptions / cliInspect → NODE_OPTIONS + --inspect debug injection blocked
#   - cookieEncryption on      → session cookies encrypted at rest (OS crypto)
#   - asar integrity + onlyLoadAppFromAsar → app code must match the signed asar
#     hash and can only load from the asar (no on-disk tampering / sideload).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  icon: build/icon.ico
  target:
    # One-click installer (auto-updates from GitHub Releases, see `publish:`)
    # + portable single-file (can't self-update; the app says so in Settings).
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    # Microsoft Store distribution: MSIX. The Store re-signs the package, so NO
    # paid code-signing certificate is needed and SmartScreen never warns. The
    # Store also handles updates (the auto-updater no-ops for this build).
    # OPT-IN: uncomment once the real Partner Center identity is filled under
    # `appx:` below — the placeholder identity is invalid and would fail the build,
    # so it's left out of the default target set (nsis + portable build cleanly).
    # - target: appx
    #   arch:
    #     - x64
portable:
  artifactName: Flowstate.${ext}
nsis:
  artifactName: Flowstate-Setup-${version}.${ext}
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Flowstate
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
extraMetadata:
  main: out/main/index.js
# Microsoft Store (MSIX) identity. Reserve the app name in Partner Center
# (partner.microsoft.com) → Product Identity gives you these exact values.
# Until filled, the `appx` target still BUILDS for local sideload testing, but
# Store submission requires the real identity to match your reservation.
appx:
  identityName: REPLACE_WITH_STORE_IDENTITY_NAME      # e.g. 12345Publisher.Flowstate
  publisher: REPLACE_WITH_STORE_PUBLISHER             # e.g. CN=ABCD1234-...
  publisherDisplayName: REPLACE_WITH_PUBLISHER_NAME   # e.g. Ashton Rey Kusuma
  applicationId: Flowstate
  backgroundColor: "#0e0d0c"
# Auto-update feed: GitHub Releases of the (public) repo. electron-builder
# writes `latest.yml` into the app and uploads the installer + `latest.yml` +
# `.blockmap` to a release; the in-app updater (services/auto-update.ts) reads
# the latest published release. The Store (appx) build ignores this.
# Release (see README → Release): bump `version` in package.json, then with a
# GitHub token that can write releases in GH_TOKEN:
#   npm run package -- --publish always
# electron-builder creates a draft release; publish it on GitHub to ship.
publish:
  - provider: github
    owner: justapileofashes
    repo: flowstate-agent-os
    releaseType: draft
